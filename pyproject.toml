[project]
name = "shop-manager"
version = "0.1.0"
description = "Vehicle inspection and shop management system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.36",
    "pydantic==2.9.2",
    "pydantic[email]==2.9.2",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.23.8",
    "httpx==0.28.1",
    "ruff==0.7.3",
]

[tool.uv]
dev-dependencies = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
