{% extends "base.html" %}
{% block title %}Customers - Shop Manager{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title">Customers</h2>
        <button class="btn btn-primary" hx-get="/customers/new" hx-target="#modal" hx-swap="innerHTML" hx-on::after-request="document.getElementById('modal').showModal()">+ New Customer</button>
    </div>

    <div class="search-bar">
        <input type="search" name="q" value="{{ q }}" placeholder="Search customers..." hx-get="/customers" hx-target="#customers-table" hx-trigger="search, keyup changed delay:300ms">
    </div>

    <div class="table-wrap" id="customers-table">
        <table>
            <thead>
                <tr><th>Name</th><th>Phone</th><th>Email</th><th>Actions</th></tr>
            </thead>
            <tbody>
                {% for c in customers %}
                <tr id="customer-{{ c.id }}">
                    <td>{{ c.name }}</td>
                    <td>{{ c.phone or '—' }}</td>
                    <td>{{ c.email or '—' }}</td>
                    <td class="actions">
                        <button class="btn btn-secondary btn-sm" hx-get="/customers/{{ c.id }}/edit" hx-target="#modal" hx-swap="innerHTML" hx-on::after-request="document.getElementById('modal').showModal()">Edit</button>
                        <button class="btn btn-danger btn-sm" hx-delete="/customers/{{ c.id }}" hx-target="#customer-{{ c.id }}" hx-swap="outerHTML" hx-confirm="Delete {{ c.name }}?">Delete</button>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="4" style="text-align:center; color: var(--fg-muted); padding: 40px;">No customers yet</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<dialog id="modal" class="modal-backdrop" style="display:none;">
    <div class="modal" id="modal-content"></div>
</dialog>

<script>
document.body.addEventListener('htmx:afterSwap', function(evt) {
    if (evt.detail.target.id === 'modal-content') {
        document.getElementById('modal').showModal();
    }
});
document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) this.close();
});
</script>
{% endblock %}
