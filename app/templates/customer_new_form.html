<form method="dialog" hx-post="/customers" hx-target="#customers-table tbody" hx-swap="afterbegin" hx-on::after-request="document.getElementById('modal').close()">
    <h3 style="margin-bottom: 20px;">New Customer</h3>
    <div class="form-row">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone">
        </div>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email">
        </div>
    </div>
    <div class="form-group">
        <label>Address</label>
        <textarea name="address" rows="2"></textarea>
    </div>
    <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" rows="3"></textarea>
    </div>
    <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:24px;">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal').close()">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Customer</button>
    </div>
</form>
